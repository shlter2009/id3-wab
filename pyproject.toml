[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "id3-sit-web"
version = "0.2.0"
description = "Browser-based audio conversion and conservative ID3 metadata management"
requires-python = ">=3.11"
dependencies = ["flask>=3.1,<4", "waitress>=3,<4", "mutagen>=1.47,<2", "requests>=2.32,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[project.scripts]
id3-sit-web = "music_manager.web:main"

[tool.setuptools.packages.find]
include = ["music_manager*"]

[tool.setuptools.package-data]
music_manager = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
